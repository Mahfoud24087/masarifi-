<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Background: Smooth Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Decorative Circle Glow -->
  <circle cx="256" cy="256" r="180" fill="#FFFFFF" opacity="0.08"/>

  <!-- Modern Financial Symbol: Downward Trend & Savings Arrow -->
  <g filter="url(#shadow)" stroke="url(#lineGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Trend path -->
    <path d="M 120 180 L 220 280 L 300 200 L 390 320" />
    <!-- Downward Arrow head -->
    <path d="M 390 230 L 390 320 L 300 320" />
  </g>

  <!-- Central Coin / Currency Dot -->
  <circle cx="256" cy="380" r="18" fill="#FFFFFF" opacity="0.9"/>
</svg>
